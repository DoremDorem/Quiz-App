<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-900">
<form class="bg-white login-form rounded-lg shadow-xl text-sm text-gray-500 border border-gray-200 p-8 py-12 w-80 sm:w-[352px]">
    <p class="text-2xl font-medium text-center">
        <span class="text-indigo-500">User</span> Login
    </p>

    <div class="mt-4">
        <label class="block">Email</label>
        <input type="email" placeholder="type here" required
            class="border border-gray-200 rounded w-full p-2 mt-1 outline-indigo-500">
    </div>

    <div class="mt-4">
        <label class="block">Password</label>
        <input type="password" placeholder="type here" required
            class="border border-gray-200 rounded w-full p-2 mt-1 outline-indigo-500">
    </div>

    <p class="mt-4">
        Create an account?
        <a href="./register.html" class="text-indigo-500">Click here</a>
    </p>

    <button type="submit" class="bg-indigo-500 login-btn hover:bg-indigo-600 transition-all text-white w-full py-2 rounded-md mt-4 cursor-pointer">
        Login
    </button>
     <p class="text-center mt-2 message-container"></p>
</form>


<script src="./login.js"></script>
</body>
</html>
